  <title id="title">luiz@linux: ~ — fish</title>
  <desc id="desc">Junior technical support analyst and cybersecurity student. Completed the Santander Cybersecurity Bootcamp. Interested in Linux, systems, automation and open source. Exploring Blue Team and SOC work, with detection engineering as a longer-term goal. Setup: CachyOS, Fish, Kitty and Hyprland.</desc>
